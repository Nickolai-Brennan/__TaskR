services:
  db:
    image: postgres:16-alpine
    container_name: taskr-postgres
    environment:
      POSTGRES_USER: taskr
      POSTGRES_PASSWORD: taskr
      POSTGRES_DB: taskr
    ports:
      - "5432:5432"
    volumes:
      - taskr_pg:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskr -d taskr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: taskr-api
    environment:
      DATABASE_URL: postgresql+psycopg://taskr:taskr@db:5432/taskr
      CORS_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    container_name: taskr-angular
    ports:
      - "4200:4200"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src

volumes:
  taskr_pg:
