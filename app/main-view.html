<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskR</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e10;--surface:#17171a;--surface2:#1f1f24;--surface3:#27272d;
  --border:#2e2e36;--border2:#3a3a44;
  --text:#e8e8f0;--muted:#7a7a8e;--hint:#4a4a5a;
  --accent:#7c6ef5;--accent2:#a594f9;--accent-dim:#2a2450;
  --green:#3ecf8e;--green-dim:#122d22;
  --amber:#f59e0b;--amber-dim:#2d2010;
  --coral:#f87171;--coral-dim:#2d1212;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  font-family:'Syne',sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overflow:hidden}
.app{display:grid;grid-template-columns:260px 1fr 320px;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/-1;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:20}
.logo{font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#a594f9;white-space:nowrap}
.logo span{color:var(--muted)}
.topbar-search{flex:1;max-width:340px;position:relative}
.topbar-search input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px 6px 32px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;outline:none;transition:border-color .2s}
.topbar-search input:focus{border-color:var(--accent)}
.topbar-search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.topbar-pills{display:flex;gap:5px}
.pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);transition:all .15s;font-family:'Syne',sans-serif;letter-spacing:.3px}
.pill.active,.pill:hover{background:var(--accent-dim);border-color:var(--accent);color:#a594f9}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-dim);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#a594f9;margin-left:auto;cursor:pointer;flex-shrink:0}
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
.sidebar-section{padding:14px 12px 6px;font-size:10px;font-weight:700;color:var(--hint);letter-spacing:1.5px;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between}
.sidebar-add{cursor:pointer;color:var(--hint);font-size:16px;line-height:1;padding:0 2px;transition:color .15s}
.sidebar-add:hover{color:var(--accent2)}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;border-radius:var(--radius);margin:0 6px 1px;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;border:1px solid transparent}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:#a594f9;border-color:var(--accent-dim)}
.nav-item .ni{width:16px;text-align:center;font-size:13px;flex-shrink:0}
.nav-badge{margin-left:auto;border-radius:10px;font-size:10px;font-weight:700;padding:1px 6px;font-family:'JetBrains Mono',monospace;background:var(--accent);color:#fff;flex-shrink:0}
.nav-badge.green{background:var(--green)}
.project-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.divider{height:1px;background:var(--border);margin:6px 12px}
.tag-nav-row{display:flex;align-items:center;gap:6px;padding:5px 14px;margin:0 6px 1px;cursor:pointer;border-radius:var(--radius);transition:all .15s;border:1px solid transparent}
.tag-nav-row:hover{background:var(--surface2)}
.tag-nav-row.active{background:var(--accent-dim);border-color:var(--accent-dim)}
.tag-bubble{font-size:10px;font-weight:700;padding:2px 7px;border-radius:8px;font-family:'JetBrains Mono',monospace}
.main{background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;min-height:0}
.quick-entry{margin:14px 20px 0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:13px 14px;transition:border-color .2s;flex-shrink:0}
.quick-entry:focus-within{border-color:var(--accent)}
.qe-top{display:flex;align-items:flex-start;gap:10px}
.qe-icon{width:28px;height:28px;border-radius:var(--radius);background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:1px}
.qe-input{flex:1;min-width:0}
.qe-title{width:100%;background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.qe-title::placeholder{color:var(--hint)}
.qe-note{width:100%;background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:12px;color:var(--muted);resize:none;line-height:1.5}
.qe-note::placeholder{color:var(--hint)}
.qe-meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.qe-chip{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border2);background:var(--surface2);color:var(--muted);cursor:pointer;transition:all .15s;font-family:'Syne',sans-serif}
.qe-chip:hover{border-color:var(--accent);color:#a594f9}
.qe-chip.selected{background:var(--accent-dim);border-color:var(--accent);color:#a594f9}
.qe-chip select,.qe-chip input[type=date]{background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;color:inherit;cursor:pointer;max-width:110px}
.qe-chip select option{background:var(--surface2)}
.add-btn{padding:5px 13px;background:var(--accent);border:none;border-radius:var(--radius);color:#fff;font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.add-btn:hover{background:#a594f9;transform:translateY(-1px)}
.add-btn:active{transform:translateY(0)}
.qe-tags-wrap{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:3px 9px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);min-height:26px;cursor:text;transition:border-color .15s;position:relative}
.qe-tags-wrap:focus-within{border-color:var(--accent)}
.qe-tag-chip{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:7px;font-family:'JetBrains Mono',monospace}
.qe-tag-chip .rm{cursor:pointer;opacity:.6;font-size:9px}
.qe-tag-chip .rm:hover{opacity:1}
.qe-tag-input{background:transparent;border:none;outline:none;font-family:'Syne',sans-serif;font-size:11px;color:var(--text);min-width:50px;width:60px}
.tag-dropdown{position:absolute;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:4px;z-index:50;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.5);top:calc(100% + 4px);left:0}
.tag-dd-item{padding:5px 9px;border-radius:6px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.tag-dd-item:hover{background:var(--surface3)}
.tag-dd-item.create{color:var(--accent2);font-weight:600}
.filter-bar{display:flex;align-items:center;gap:7px;padding:9px 20px 0;flex-wrap:wrap;flex-shrink:0}
.filter-label{font-size:10px;font-weight:700;color:var(--hint);letter-spacing:.8px;text-transform:uppercase}
.filter-group{display:flex;align-items:center;gap:3px}
.filter-btn{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;transition:all .12s}
.filter-btn:hover{border-color:var(--border2);color:var(--text)}
.filter-btn.on{border-color:var(--accent);background:var(--accent-dim);color:#a594f9}
.filter-sep{width:1px;height:14px;background:var(--border2)}
.filter-clear{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid var(--coral-dim);background:transparent;color:var(--coral);cursor:pointer;font-family:'Syne',sans-serif;transition:all .12s;margin-left:auto}
.filter-clear:hover{background:var(--coral-dim)}
.board-header{display:flex;align-items:center;gap:10px;padding:12px 20px 8px;flex-shrink:0}
.board-title{font-size:18px;font-weight:800;letter-spacing:-0.5px}
.board-count{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:10px;font-family:'JetBrains Mono',monospace}
.view-btns{margin-left:auto;display:flex;gap:3px}
.vbtn{padding:4px 10px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;font-family:'Syne',sans-serif;transition:all .12s}
.vbtn.active,.vbtn:hover{background:var(--surface2);color:var(--text);border-color:var(--border2)}
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px 20px;align-content:start}
.col{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.col-head{padding:10px 13px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.col-dot{width:7px;height:7px;border-radius:50%}
.col-name{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.col-cnt{margin-left:auto;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--hint)}
.col-cards{padding:7px;display:flex;flex-direction:column;gap:6px;min-height:50px}
.card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px;cursor:pointer;transition:all .18s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.card.p-high::before{background:var(--coral)}
.card.p-med::before{background:var(--amber)}
.card.p-low::before{background:var(--green)}
.card:hover{border-color:var(--border2);background:var(--surface3);transform:translateY(-1px)}
.card:hover .card-actions{opacity:1}
.card-title{font-size:12px;font-weight:600;margin-bottom:5px;line-height:1.4;padding-left:7px}
.card-note{font-size:10px;color:var(--muted);line-height:1.45;padding-left:7px;margin-bottom:6px}
.card-footer{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding-left:7px}
.tag{font-size:9px;font-weight:700;padding:2px 5px;border-radius:7px;font-family:'JetBrains Mono',monospace}
.card-due{font-size:9px;color:var(--muted);margin-left:auto;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.card-due.overdue{color:var(--coral)}
.card-actions{position:absolute;top:6px;right:6px;display:flex;gap:3px;opacity:0;transition:opacity .12s}
.card-action{width:18px;height:18px;border-radius:5px;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:9px;color:var(--muted);transition:all .1s}
.card-action:hover{background:var(--surface);color:var(--text)}
.list-view{display:none;flex-direction:column;padding:0 20px 20px}
.list-item{display:flex;align-items:flex-start;gap:11px;padding:9px 11px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s;border-radius:var(--radius)}
.list-item:hover{background:var(--surface)}
.li-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;transition:all .12s}
.li-check.done{background:var(--green);border-color:var(--green)}
.li-content{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;margin-bottom:3px}
.li-title.done{text-decoration:line-through;color:var(--muted)}
.li-sub{font-size:11px;color:var(--muted);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.li-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* PROJECT PAGE */
.project-page{display:none;flex-direction:column;overflow-y:auto;height:100%}
.proj-hero{padding:24px 24px 0;flex-shrink:0}
.proj-hero-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.proj-avatar{width:46px;height:46px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.proj-hero-name{font-size:22px;font-weight:800;letter-spacing:-0.5px}
.proj-hero-meta{font-size:12px;color:var(--muted);margin-top:2px}
.proj-hero-btn{padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;font-size:11px;font-weight:600;transition:all .12s;margin-left:auto}
.proj-hero-btn:hover{color:var(--text);background:var(--surface2)}
.proj-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.proj-stat{background:var(--surface2);border-radius:var(--radius-lg);padding:11px 13px;border:1px solid var(--border)}
.proj-stat-n{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace}
.proj-stat-l{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-top:2px}
.proj-prog-bar{height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;margin-bottom:18px}
.proj-prog-fill{height:100%;border-radius:2px;transition:width .5s}
.proj-section{padding:0 24px 12px}
.proj-section-head{font-size:10px;font-weight:700;color:var(--hint);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:8px}
.proj-tag-cloud{display:flex;flex-wrap:wrap;gap:6px}
.proj-tag-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:transform .12s}
.proj-tag-pill:hover{transform:scale(1.06)}
.proj-tasks{padding:0 24px 24px;display:flex;flex-direction:column;gap:5px}
.proj-task-item{display:flex;align-items:center;gap:9px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);cursor:pointer;transition:all .13s}
.proj-task-item:hover{border-color:var(--border2);background:var(--surface2)}
.proj-task-check{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--border2);flex-shrink:0;transition:all .12s}
.proj-task-check.done{background:var(--green);border-color:var(--green)}
.proj-task-title{flex:1;font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-task-title.done{text-decoration:line-through;color:var(--muted)}
.proj-task-badges{display:flex;gap:5px;align-items:center;flex-shrink:0}
/* TAGS PAGE */
.tags-page{display:none;flex-direction:column;overflow-y:auto;padding:22px}
.tags-page-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.tags-page-sub{font-size:12px;color:var(--muted);margin-bottom:18px}
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-bottom:20px}
.tag-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:13px 14px;cursor:pointer;transition:all .16s}
.tag-card:hover{border-color:var(--border2);transform:translateY(-1px)}
.tag-card-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.tag-card-name{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.tag-card-cnt{font-size:10px;color:var(--muted);margin-left:auto;font-family:'JetBrains Mono',monospace}
.tag-card-bar{height:3px;border-radius:2px;margin-bottom:6px}
.tag-card-tasks{font-size:10px;color:var(--muted)}
.add-tag-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.add-tag-form input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:5px 9px;color:var(--text);font-family:'Syne',sans-serif;font-size:12px;outline:none;transition:border-color .12s}
.add-tag-form input:focus{border-color:var(--accent)}
.color-swatches{display:flex;gap:5px;flex-wrap:wrap}
.swatch{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .12s;flex-shrink:0}
.swatch.selected{border-color:#fff;transform:scale(1.2)}
/* DETAIL PANEL */
.detail-panel{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.dp-head{padding:13px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.dp-back{width:25px;height:25px;border-radius:var(--radius);border:1px solid var(--border2);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .12s;font-family:'Syne',sans-serif;flex-shrink:0}
.dp-back:hover{background:var(--surface2);color:var(--text)}
.dp-title{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp-section{padding:13px 15px;border-bottom:1px solid var(--border)}
.dp-label{font-size:10px;font-weight:700;color:var(--hint);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}
.dp-muted{color:var(--muted);font-size:12px;line-height:1.6}
.dp-stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.dp-stat:last-child{border:none}
.dp-stat-k{font-size:12px;color:var(--muted)}
.dp-stat-v{font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
.progress-bar{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:7px}
.progress-fill{height:100%;border-radius:3px;background:var(--accent);transition:width .4s}
.obsidian-graph{width:100%;height:130px;position:relative;overflow:hidden}
.graph-node{position:absolute;border-radius:50%;cursor:pointer;transition:transform .15s}
.graph-node:hover{transform:scale(1.35) !important}
.graph-line{position:absolute;height:1px;transform-origin:left center;pointer-events:none;opacity:.35}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:11px 13px}
.stat-mini{background:var(--surface2);border-radius:var(--radius);padding:9px 11px}
.stat-mini-n{font-size:20px;font-weight:800;color:#a594f9;font-family:'JetBrains Mono',monospace}
.stat-mini-l{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;margin-top:2px}
.empty-state{text-align:center;padding:18px;color:var(--hint);font-size:12px}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-xl);padding:22px;width:360px;max-width:90vw}
.modal-title{font-size:15px;font-weight:800;margin-bottom:14px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:5px}
.modal-field input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 10px;color:var(--text);font-family:'Syne',sans-serif;font-size:13px;outline:none;transition:border-color .12s}
.modal-field input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal-btn{padding:6px 14px;border-radius:var(--radius);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;border:1px solid var(--border2)}
.modal-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-btn.primary:hover{background:#a594f9}
.modal-btn.ghost{background:transparent;color:var(--muted)}
.modal-btn.ghost:hover{color:var(--text);background:var(--surface2)}
</style>
</head>
<body>
<div class="app">

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">Task<span>R</span></div>
  <
