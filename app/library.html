<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskR — Reference Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* dark warm library palette */
  --ink:#0d0c0a;
  --paper:#121110;
  --shelf:#1a1816;
  --card:#201e1b;
  --card2:#272421;
  --card3:#302d29;
  --line:#2e2b27;
  --line2:#3e3a35;
  --line3:#524e48;
  --txt:#e8e4dc;
  --mid:#a09890;
  --dim:#6a6258;
  --ghost:#3e3a35;
  /* accent: aged gold */
  --gold:#c9a84c;
  --gold2:#e8c96a;
  --gold-d:#1f1a0e;
  --gold-g:rgba(201,168,76,.1);
  /* type accents */
  --teal:#4ecdc4;--teal-d:#0d2220;
  --rose:#e8836e;--rose-d:#271410;
  --sage:#7cb47e;--sage-d:#111f12;
  --lav:#9b8ff5;--lav-d:#13102a;
  --sky:#6aa9d8;--sky-d:#0d1d2a;
  --r:8px;--rl:12px;--rxl:18px;
  font-family:'Syne',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--txt);min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 60% 30% at 20% 0%,rgba(201,168,76,.04) 0%,transparent 70%),
    radial-gradient(ellipse 40% 50% at 80% 100%,rgba(78,205,196,.03) 0%,transparent 70%);
}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--line3)}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes glow-gold{0%,100%{box-shadow:0 0 0 0 rgba(201,168,76,0)}50%{box-shadow:0 0 16px 2px rgba(201,168,76,.18)}}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:100;
  display:flex;align-items:center;gap:14px;
  padding:0 32px;height:56px;
  background:rgba(13,12,10,.9);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.nav-logo{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);letter-spacing:.5px;cursor:pointer}
.nav-logo em{font-style:italic;color:var(--gold2)}
.nav-sep{width:1px;height:20px;background:var(--line2)}
.nav-title{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;font-family:'DM Mono',monospace}
.nav-search{
  flex:1;max-width:380px;margin:0 auto;position:relative;
}
.nav-search input{
  width:100%;background:var(--shelf);border:1px solid var(--line2);border-radius:var(--r);
  padding:7px 12px 7px 34px;color:var(--txt);font-family:'Syne',sans-serif;font-size:12px;outline:none;transition:all .2s;
}
.nav-search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-g)}
.nav-search input::placeholder{color:var(--dim)}
.nav-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--dim);stroke-width:2;pointer-events:none}
.nav-actions{display:flex;gap:6px;align-items:center}
.nbtn{display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;border:1px solid var(--line2);background:transparent;color:var(--mid);font-family:'Syne',sans-serif;letter-spacing:.3px}
.nbtn:hover{background:var(--shelf);color:var(--txt);border-color:var(--line3)}
.nbtn.gold{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.nbtn.gold:hover{background:var(--gold2)}

/* ── HERO SECTION ── */
.hero{
  padding:52px 32px 40px;
  border-bottom:1px solid var(--line);
  position:relative;overflow:hidden;
}
.hero::before{
  content:'REFERENCE LIBRARY';
  position:absolute;right:-20px;top:50%;transform:translateY(-50%);
  font-family:'Playfair Display',serif;font-size:120px;font-weight:900;color:var(--line);
  letter-spacing:-4px;white-space:nowrap;pointer-events:none;line-height:1;
  opacity:.4;
}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hero-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold);opacity:.6}
.hero-title{font-family:'Playfair Display',serif;font-size:46px;font-weight:900;letter-spacing:-.5px;line-height:1.05;margin-bottom:14px}
.hero-title em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:14px;color:var(--mid);line-height:1.7;max-width:520px;font-weight:400}
.hero-stats{display:flex;gap:32px;margin-top:28px}
.hs{display:flex;flex-direction:column;gap:3px}
.hs-n{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--txt)}
.hs-l{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-family:'DM Mono',monospace}

/* ── LAYOUT ── */
.page{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px)}

/* ── SIDEBAR ── */
.sidebar{
  background:var(--shelf);border-right:1px solid var(--line);
  padding:24px 0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
}
.sb-section{padding:6px 18px 3px;font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-top:12px}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;
  font-size:12px;font-weight:600;color:var(--mid);transition:all .14s;
  border-left:2px solid transparent;margin:1px 0;
}
.sb-item:hover{background:var(--card);color:var(--txt)}
.sb-item.active{background:var(--card);color:var(--gold);border-left-color:var(--gold)}
.sb-item .sb-icon{font-size:14px;flex-shrink:0;width:18px;text-align:center}
.sb-item .sb-cnt{margin-left:auto;font-size:9px;font-family:'DM Mono',monospace;color:var(--dim);background:var(--card3);padding:1px 5px;border-radius:6px}
.sb-divider{height:1px;background:var(--line);margin:10px 18px}
.sb-new{
  display:flex;align-items:center;gap:8px;margin:12px 14px 0;
  padding:8px 12px;border-radius:var(--r);border:1px dashed var(--line2);
  color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .14s;
}
.sb-new:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-d)}

/* ── MAIN CONTENT ── */
.content{padding:28px 32px 60px}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.tbar-group{display:flex;gap:4px}
.tbar-btn{padding:5px 11px;border-radius:var(--r);font-size:10px;font-weight:700;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;transition:all .12s;font-family:'DM Mono',monospace;letter-spacing:.4px}
.tbar-btn:hover{background:var(--card);color:var(--txt)}
.tbar-btn.on{background:var(--gold-d);border-color:var(--gold);color:var(--gold)}
.tbar-sep{width:1px;height:18px;background:var(--line2)}
.view-toggle{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.vt{padding:5px 10px;font-size:11px;cursor:pointer;color:var(--dim);background:transparent;border:none;transition:all .12s}
.vt.on{background:var(--card2);color:var(--txt)}
.sort-sel{background:var(--shelf);border:1px solid var(--line2);border-radius:var(--r);padding:5px 10px;color:var(--mid);font-family:'DM Mono',monospace;font-size:10px;outline:none;cursor:pointer}
.sort-sel option{background:var(--card)}
.result-cnt{margin-left:auto;font-size:10px;color:var(--dim);font-family:'DM Mono',monospace}

/* ── SECTION HEADING ── */
.sec-heading{display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:28px}
.sec-heading:first-child{margin-top:0}
.sh-spine{width:3px;height:28px;border-radius:2px;flex-shrink:0}
.sh-text{flex:1}
.sh-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;line-height:1.2}
.sh-sub{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;letter-spacing:.5px;margin-top:1px}
.sh-line{flex:1;height:1px;background:var(--line)}
.sh-count{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;white-space:nowrap}

/* ── CARD GRID ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:8px}
.card-grid.list-mode{grid-template-columns:1fr}

/* ── REFERENCE CARD ── */
.ref-card{
  background:var(--card);border:1px solid var(--line2);border-radius:var(--rxl);
  overflow:hidden;cursor:pointer;transition:all .2s;position:relative;
  display:flex;flex-direction:column;
}
.ref-card:hover{border-color:var(--line3);box-shadow:0 8px 32px rgba(0,0,0,.45);transform:translateY(-2px)}
.ref-card:hover .rc-footer{opacity:1}
.ref-card:hover .rc-actions{opacity:1}
/* spine accent */
.rc-spine{width:100%;height:4px;flex-shrink:0;transition:height .2s}
.ref-card:hover .rc-spine{height:5px}
.rc-body{padding:16px 18px 12px;flex:1}
.rc-type-row{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.rc-type{font-family:'DM Mono',monospace;font-size:8px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.rc-new{font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--gold-d);color:var(--gold);font-family:'DM Mono',monospace;letter-spacing:.4px;border:1px solid var(--gold)33}
.rc-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;line-height:1.35;margin-bottom:8px;color:var(--txt)}
.rc-excerpt{font-size:12px;color:var(--mid);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.rc-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.rc-tag{font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;font-family:'DM Mono',monospace;background:var(--card3);color:var(--mid)}
.rc-footer{display:flex;align-items:center;gap:8px;padding:10px 18px 14px;border-top:1px solid var(--line);opacity:.7;transition:opacity .15s}
.rc-author{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-date{font-size:9px;color:var(--ghost);font-family:'DM Mono',monospace;white-space:nowrap}
.rc-read-time{font-size:9px;color:var(--ghost);font-family:'DM Mono',monospace;white-space:nowrap}
.rc-actions{position:absolute;top:10px;right:10px;display:flex;gap:3px;opacity:0;transition:opacity .15s}
.rc-act{width:24px;height:24px;border-radius:6px;background:var(--card3);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;color:var(--mid);transition:all .12s}
.rc-act:hover{background:var(--card2);color:var(--txt)}

/* List mode card */
.list-mode .ref-card{flex-direction:row;border-radius:var(--rl)}
.list-mode .rc-spine{width:4px;height:auto;flex-shrink:0;border-radius:var(--rl) 0 0 var(--rl)}
.list-mode .rc-body{padding:14px 16px}
.list-mode .rc-footer{border-top:none;border-left:1px solid var(--line);padding:14px 16px;min-width:160px;flex-direction:column;align-items:flex-start;justify-content:center;gap:5px}
.list-mode .rc-title{font-size:14px;margin-bottom:5px}
.list-mode .rc-excerpt{-webkit-line-clamp:2;font-size:11px}

/* ── FEATURED CARD (full width) ── */
.featured-card{
  background:var(--card);border:1px solid var(--line2);border-radius:var(--rxl);
  overflow:hidden;cursor:pointer;transition:all .2s;margin-bottom:12px;
  display:grid;grid-template-columns:1fr 260px;min-height:200px;
}
.featured-card:hover{border-color:var(--gold);box-shadow:0 12px 40px rgba(0,0,0,.5);transform:translateY(-2px)}
.fc-body{padding:24px 28px;display:flex;flex-direction:column;justify-content:space-between}
.fc-eyebrow{font-family:'DM Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.fc-eyebrow::before{content:'';width:16px;height:1px;background:var(--gold)}
.fc-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:900;line-height:1.2;margin-bottom:10px}
.fc-excerpt{font-size:13px;color:var(--mid);line-height:1.65;flex:1;margin-bottom:14px}
.fc-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fc-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:6px;font-family:'DM Mono',monospace}
.fc-side{border-left:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:10px;background:var(--card2)}
.fc-side-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}
.fc-chapter{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:var(--r);background:var(--card3);font-size:11px;font-weight:600;cursor:pointer;transition:all .12s;border:1px solid transparent}
.fc-chapter:hover{border-color:var(--line3);background:var(--card)}
.fc-ch-num{font-family:'DM Mono',monospace;font-size:9px;color:var(--dim);width:16px;flex-shrink:0}
.fc-ch-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.fc-ch-dur{font-size:9px;color:var(--dim);font-family:'DM Mono',monospace;white-space:nowrap}

/* ── READING PANEL (right side overlay) ── */
.reading-panel{
  position:fixed;right:0;top:56px;bottom:0;width:480px;
  background:var(--paper);border-left:1px solid var(--line2);
  transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
  z-index:50;display:flex;flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.5);
}
.reading-panel.open{transform:translateX(0)}
.rp-nav{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.rp-close{width:28px;height:28px;border-radius:50%;background:var(--shelf);border:none;color:var(--mid);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.rp-close:hover{background:var(--card2);color:var(--txt)}
.rp-breadcrumb{font-size:11px;color:var(--dim);font-family:'DM Mono',monospace;flex:1}
.rp-actions{display:flex;gap:4px}
.rp-act{width:28px;height:28px;border-radius:var(--r);background:var(--shelf);border:1px solid var(--line2);color:var(--mid);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.rp-act:hover{background:var(--card2);color:var(--txt)}
.rp-act.bookmarked{color:var(--gold)}
.rp-body{flex:1;overflow-y:auto;padding:24px 28px 40px}
.rp-type-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rp-type-badge{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border-radius:5px}
.rp-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:900;line-height:1.15;margin-bottom:12px}
.rp-subtitle{font-size:14px;color:var(--mid);line-height:1.6;margin-bottom:18px}
.rp-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.rp-meta-item{display:flex;flex-direction:column;gap:2px}
.rp-meta-key{font-family:'DM Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.rp-meta-val{font-size:11px;font-weight:600;color:var(--mid)}
/* article body */
.rp-content{font-size:13px;color:var(--mid);line-height:1.8}
.rp-content h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--txt);margin:22px 0 8px}
.rp-content p{margin-bottom:12px}
.rp-content code{font-family:'DM Mono',monospace;font-size:11px;background:var(--card3);border:1px solid var(--line2);padding:1px 5px;border-radius:4px;color:var(--teal)}
.rp-content pre{background:var(--card);border:1px solid var(--line2);border-radius:var(--rl);padding:14px 16px;margin:14px 0;overflow-x:auto}
.rp-content pre code{background:transparent;border:none;padding:0;color:var(--txt);font-size:11px;line-height:1.7}
.rp-content ul{margin:8px 0 12px 16px;display:flex;flex-direction:column;gap:5px}
.rp-content li{font-size:13px;color:var(--mid);line-height:1.65}
.rp-content li::marker{color:var(--gold)}
.rp-content .callout{background:var(--gold-d);border:1px solid var(--gold)33;border-left:3px solid var(--gold);border-radius:var(--r);padding:12px 14px;margin:14px 0;font-size:12px}
.rp-content .callout strong{color:var(--gold)}
.rp-content .step{display:flex;gap:12px;margin-bottom:16px;align-items:flex-start}
.rp-content .step-num{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.rp-content .step-body{flex:1}
.rp-content .step-title{font-weight:700;color:var(--txt);margin-bottom:4px;font-size:13px}
/* progress bar in panel */
.rp-progress{height:3px;background:var(--line);position:relative}
.rp-prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0%;transition:width .3s}

/* ── TAGS MANAGER (sidebar) ── */
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px;padding:10px 18px}
.tc-tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:'DM Mono',monospace;cursor:pointer;transition:all .13px;border:1px solid var(--line2);background:transparent;color:var(--dim)}
.tc-tag:hover,.tc-tag.on{border-color:var(--gold);background:var(--gold-d);color:var(--gold)}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex;animation:fadeIn .18s ease}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:var(--rxl);width:500px;max-width:95vw;max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.8)}
.modal-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.modal-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.modal-htxt{flex:1}
.modal-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
.modal-sub{font-size:11px;color:var(--dim);margin-top:3px}
.modal-close{width:28px;height:28px;border-radius:50%;background:var(--card3);border:none;color:var(--mid);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .12s;flex-shrink:0}
.modal-close:hover{background:var(--card2);color:var(--txt)}
.modal-body{padding:20px 24px}
.mf{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.mf label{font-size:9px;font-weight:700;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-family:'DM Mono',monospace}
.mf input,.mf select,.mf textarea{background:var(--card3);border:1px solid var(--line2);border-radius:var(--r);padding:8px 11px;color:var(--txt);font-family:'Syne',sans-serif;font-size:12px;outline:none;transition:border-color .15px;width:100%}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--gold)}
.mf input::placeholder,.mf textarea::placeholder{color:var(--ghost)}
.mf select option{background:var(--card)}
.mf textarea{resize:vertical;min-height:80px;line-height:1.65}
.mf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.type-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.type-opt{padding:10px 8px;border-radius:var(--r);border:1px solid var(--line2);background:transparent;cursor:pointer;text-align:center;transition:all .13s}
.type-opt:hover{border-color:var(--line3);background:var(--card2)}
.type-opt.on{border-color:var(--gold);background:var(--gold-d)}
.type-opt .to-icon{font-size:18px;display:block;margin-bottom:4px}
.type-opt .to-label{font-size:10px;font-weight:700;font-family:'DM Mono',monospace;color:var(--mid)}
